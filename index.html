
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>SUT Kontrol Sistemi</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f6f9fc; }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 22px; margin: 0; }
    header img.logo { height: 30px; }

    main { padding: 20px; max-width: 800px; margin: auto; }

    .search-section input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    #sonuclar {
      margin-top: 10px;
      list-style: none;
      background: white;
      border: 1px solid #ccc;
      border-radius: 5px;
      max-height: 300px;
      overflow-y: auto;
      padding: 0;
    }

    #sonuclar li {
      padding: 10px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    #sonuclar li:hover { background-color: #f0f0f0; }

    #sutKutusu {
      margin-top: 20px;
      padding: 15px;
      background: #e9f3ff;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .sut-grup-icon {
      display: inline-block;
      width: 24px;
      height: 24px;
      vertical-align: middle;
      margin-right: 8px;
    }

    .info-icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      background-color: #3498db;
      color: white;
      border-radius: 50%;
      text-align: center;
      font-size: 12px;
      line-height: 16px;
      cursor: default;
      margin-left: 5px;
    }

  </style>
</head>
<body>
  <header>
    <h1>SUT Kontrol Sistemi</h1>
    <img src="https://cdn-icons-png.flaticon.com/512/3209/3209349.png" class="logo" alt="Logo">
  </header>
  <main>
    <div class="search-section">
      <input type="text" id="ilacArama" placeholder="İlaç ismi, barkod veya etken madde..." oninput="aramaYap()">
      <ul id="sonuclar"></ul>
      <div id="sutKutusu"></div>
    </div>
  </main>

<script>
let ilaclar = [];
let sutVeri = {};

fetch('ilaclar_listesi.json')
  .then(res => res.json())
  .then(data => ilaclar = data);

fetch('ilaclar_sut.json')
  .then(res => res.json())
  .then(data => sutVeri = data);

function aramaYap() {
  const input = document.getElementById("ilacArama").value.toLowerCase();
  const sonuclar = document.getElementById("sonuclar");
  const sutKutusu = document.getElementById("sutKutusu");
  sonuclar.innerHTML = "";
  sutKutusu.innerHTML = "";

  if (input.length < 3) return;

  const filtreli = ilaclar.filter(ilac =>
    (ilac.isim && ilac.isim.toLowerCase().includes(input)) ||
    (ilac.etken_madde && ilac.etken_madde.toLowerCase().includes(input)) ||
    (ilac.barkod && ilac.barkod.includes(input))
  );

  filtreli.slice(0, 100).forEach(ilac => {
    const li = document.createElement("li");
    li.textContent = `${ilac.isim} - ${ilac.etken_madde} (Barkod: ${ilac.barkod})`;
    li.onclick = () => ilacSec(ilac);
    sonuclar.appendChild(li);
  });
}

function grupIkon(grupAdi) {
  if (grupAdi.toLowerCase().includes("biyolojik")) return "🧬";
  if (grupAdi.toLowerCase().includes("antidepresan")) return "🧠";
  if (grupAdi.toLowerCase().includes("antibiyotik")) return "💊";
  if (grupAdi.toLowerCase().includes("antifungal")) return "🍄";
  if (grupAdi.toLowerCase().includes("antiviral")) return "🦠";
  return "📄";
}

function ilacSec(ilac) {
  const sutKutusu = document.getElementById("sutKutusu");
  const secilen = ilac.isim.toLowerCase();
  const etken = ilac.etken_madde.toLowerCase();
  let bulundu = false;
  sutKutusu.innerHTML = "";

  for (const grup in sutVeri) {
    const kurallar = sutVeri[grup];
    const eslesen = kurallar.ilaclar.map(x => x.toLowerCase());
    if (eslesen.includes(secilen) || eslesen.includes(etken)) {
      const kriterler = kurallar.kriterler.map(k => `<li>${k}</li>`).join("");
      const ikon = grupIkon(kurallar.grup);
      sutKutusu.innerHTML += `
        <h3>${ikon} ${kurallar.grup} <span class="info-icon" title="Bu grup SGK SUT 4.2 maddesine aittir.">i</span></h3>
        <ul>${kriterler}</ul>
      `;
      bulundu = true;
    }
  }

  if (!bulundu) {
    sutKutusu.innerHTML = `<p>Bu ilaç için tanımlı SUT kuralı bulunamadı.</p>`;
  }
}
</script>
</body>
</html>
