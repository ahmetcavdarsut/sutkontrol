<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>İlaç Arama</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f9f9f9; }
    h1 { color: #2c3e50; }
    input, ul { width: 100%; padding: 10px; margin-top: 10px; font-size: 16px; }
    ul { list-style: none; padding: 0; background: white; border: 1px solid #ccc; max-height: 300px; overflow-y: auto; }
    li { padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; }
    li:hover { background: #f0f0f0; }
  </style>
</head>
<body>

<h1>İlaç Arama</h1>
<input type="text" id="ilacArama" placeholder="İlaç adı, barkod veya etken madde..." oninput="aramaYap()">
<ul id="sonuclar"></ul>

<script>
let ilaclar = [];

fetch('ilaclar_listesi.json')
  .then(res => res.json())
  .then(data => ilaclar = data);

function aramaYap() {
  const input = document.getElementById("ilacArama").value.toLowerCase();
  const sonuclar = document.getElementById("sonuclar");
  sonuclar.innerHTML = "";

  if (input.length < 3) return;

  const filtreli = ilaclar.filter(ilac =>
    (ilac.isim && ilac.isim.toLowerCase().includes(input)) ||
    (ilac.barkod && ilac.barkod.includes(input)) ||
    (ilac.etken_madde && ilac.etken_madde.toLowerCase().includes(input))
  );

  filtreli.slice(0, 100).forEach(ilac => {
    const li = document.createElement("li");
    li.textContent = `${ilac.isim} - ${ilac.etken_madde} (Barkod: ${ilac.barkod})`;
    li.onclick = () => alert(ilac.isim + " seçildi.");
    sonuclar.appendChild(li);
  });
}
</script>

</body>
</html>
